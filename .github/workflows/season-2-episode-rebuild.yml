# Temporary workflow: triggers a GitHub Pages rebuild each Thursday so Season 2
# episodes go live automatically on their podcastDate, without a manual rebuild.
#
# Scoped to the Season 2 weekly release window (2026-11-05 to 2026-12-10 inclusive).
# Safe to leave scheduled past that window (the date guard below no-ops outside it),
# but delete or disable this workflow once Season 2 has finished airing.
name: Season 2 episode rebuild

on:
  schedule:
    # 13:05 UTC every Wednesday = 00:05 AEDT every Thursday (Sydney is UTC+11
    # during Australian daylight saving, which covers this whole window).
    - cron: '5 13 * * 3'
  workflow_dispatch: {}

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check release window
        id: window
        run: |
          today="$(TZ=Australia/Sydney date +%F)"
          start="2026-11-05"
          end="2026-12-10"
          if [[ "$today" < "$start" || "$today" > "$end" ]]; then
            echo "Today ($today, Sydney) is outside the Season 2 release window ($start to $end) - skipping rebuild."
            echo "in_window=false" >> "$GITHUB_OUTPUT"
          else
            echo "Today ($today, Sydney) is within the Season 2 release window - triggering rebuild."
            echo "in_window=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request Pages build
        if: steps.window.outputs.in_window == 'true'
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
