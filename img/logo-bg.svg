<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="100%" height="100%" viewBox="0 0 1050 1050" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" xmlns:serif="http://www.serif.com/" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:1.5;">
    <style>
        @keyframes curveInner {
            0%     { opacity: 0; }
            15%    { opacity: 1; }
            22.5%  { opacity: 0.4; }
            30%    { opacity: 1; }
            75%    { opacity: 1; }
            82.5%  { opacity: 0; }
            100%   { opacity: 0; }
        }
        @keyframes curveOuter {
            0%     { opacity: 0; }
            32.5%  { opacity: 0; }
            47.5%  { opacity: 1; }
            55%    { opacity: 0.4; }
            62.5%  { opacity: 1; }
            75%    { opacity: 1; }
            82.5%  { opacity: 0; }
            100%   { opacity: 0; }
        }
        .curve-inner {
            animation: curveInner 8s ease-in-out infinite;
        }
        .curve-outer {
            animation: curveOuter 8s ease-in-out infinite;
        }
        .curve-inner, .curve-outer {
            filter: url(#glow);
        }
    </style>
    <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <path class="curve-inner" d="M778.472,269.459c65.772,65.244 106.528,155.671 106.528,255.541c-0,99.345 -40.328,189.345 -105.491,254.509" style="fill:none;stroke:#3C6E72;stroke-width:25px;"/>
    <path class="curve-inner" d="M267.528,776.51c-63.421,-64.912 -102.528,-153.68 -102.528,-251.51c0,-99.345 40.328,-189.345 105.491,-254.509" style="fill:none;stroke:#3C6E72;stroke-width:25px;"/>
    <path class="curve-outer" d="M821.053,227.202c76.538,76.093 123.947,181.453 123.947,297.798c-0,115.902 -47.049,220.902 -123.073,296.927" style="fill:none;stroke:#3C6E72;stroke-width:25px;"/>
    <path class="curve-outer" d="M224.947,818.767c-74.186,-75.761 -119.947,-179.462 -119.947,-293.767c0,-115.902 47.049,-220.902 123.073,-296.927" style="fill:none;stroke:#3C6E72;stroke-width:25px;"/>
</svg>
